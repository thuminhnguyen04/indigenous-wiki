<div id="plugin__gallery_" class="plugin-gallery align-full"><div class="gallery-page" id="gallery___0" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr))"><figure class="gallery-image"><a href="/lib/exe/fetch.php?media=wiki:art1.jpg" title="My Country by Damien and Yilpi Marks" data-caption="&lt;b&gt;My Country by Damien and Yilpi Marks&lt;/b&gt; &amp;ndash; My Country by Damien and Yilpi Marks celebrates the beauty and spirit of the Australian landscape. Using vibrant colors and layered patterns, the artwork reflects the artists&amp;#039; deep connection to their homeland, portraying rivers, hills, and sacred sites. It’s a visual story of the land’s energy and cultural significance, honoring the ancestral ties and traditions linked to &amp;quot;Country.&amp;quot;" class="lightbox JSnocheck" rel="lightbox[gal-1338c681c4f271dc0b764e11bae8]" data-url="/lib/exe/fetch.php?w=1600&amp;h=948&amp;tok=962f6a&amp;media=wiki:art1.jpg"><img width="600" height="600" src="/lib/exe/fetch.php?w=600&amp;h=600&amp;tok=00914b&amp;media=wiki:art1.jpg" alt="art1.jpg" loading="lazy" /></a><figcaption><a href="/lib/exe/fetch.php?media=wiki:art1.jpg" class="gallery-title" title="My Country by Damien and Yilpi Marks">My Country by Damien and Yilpi Marks</a><div class="gallery-caption">My Country by Damien and Yilpi Marks celebrates the beauty and spirit of the Australian landscape. Using vibrant colors and layered patterns, the artwork reflects the artists&#039; deep connection to their homeland, portraying rivers, hills, and sacred sites. It’s a visual story of the land’s energy and cultural significance, honoring the ancestral ties and traditions linked to &quot;Country.&quot;</div></figcaption></figure><figure class="gallery-image"><a href="/lib/exe/fetch.php?media=wiki:art2.jpg" title="Water &amp; Lightning Rain Dreaming by Long Jack Phillipus" data-caption="&lt;b&gt;Water &amp;amp; Lightning Rain Dreaming by Long Jack Phillipus&lt;/b&gt; &amp;ndash; Water &amp;amp; Lightning Rain Dreaming by Long Jack Phillipus illustrates the powerful elements of water and lightning central to Aboriginal lore. This piece symbolizes rainstorms, rivers, and the life-giving forces they bring to the land, vital for survival in desert regions. Through vibrant patterns and colors, the artwork reflects the sacred connection to these natural elements, emphasizing their role in sustaining and renewing the earth." class="lightbox JSnocheck" rel="lightbox[gal-1338c681c4f271dc0b764e11bae8]" data-url="/lib/exe/fetch.php?media=wiki:art2.jpg"><img width="600" height="600" src="/lib/exe/fetch.php?w=600&amp;h=600&amp;tok=b3bf03&amp;media=wiki:art2.jpg" alt="art2.jpg" loading="lazy" /></a><figcaption><a href="/lib/exe/fetch.php?media=wiki:art2.jpg" class="gallery-title" title="Water &amp; Lightning Rain Dreaming by Long Jack Phillipus">Water &amp; Lightning Rain Dreaming by Long Jack Phillipus</a><div class="gallery-caption">Water &amp; Lightning Rain Dreaming by Long Jack Phillipus illustrates the powerful elements of water and lightning central to Aboriginal lore. This piece symbolizes rainstorms, rivers, and the life-giving forces they bring to the land, vital for survival in desert regions. Through vibrant patterns and colors, the artwork reflects the sacred connection to these natural elements, emphasizing their role in sustaining and renewing the earth.</div></figcaption></figure><figure class="gallery-image"><a href="/lib/exe/fetch.php?media=wiki:art3.jpg" title="Tingari by George Ward Tjungurrayi" data-caption="&lt;b&gt;Tingari by George Ward Tjungurrayi&lt;/b&gt; &amp;ndash; Tingari by George Ward Tjungurrayi represents the journeys and rituals of the Tingari ancestors, a group of ancestral beings important in Aboriginal tradition. This artwork captures their travels across the land, leaving sacred sites and knowledge behind, which are crucial for guiding initiations and teaching younger generations. The abstract patterns and concentric circles in the piece echo the sacred landscape, blending spiritual stories with the natural geography of the desert." class="lightbox JSnocheck" rel="lightbox[gal-1338c681c4f271dc0b764e11bae8]" data-url="/lib/exe/fetch.php?media=wiki:art3.jpg"><img width="600" height="600" src="/lib/exe/fetch.php?w=600&amp;h=600&amp;tok=e0bd39&amp;media=wiki:art3.jpg" alt="art3.jpg" loading="lazy" /></a><figcaption><a href="/lib/exe/fetch.php?media=wiki:art3.jpg" class="gallery-title" title="Tingari by George Ward Tjungurrayi">Tingari by George Ward Tjungurrayi</a><div class="gallery-caption">Tingari by George Ward Tjungurrayi represents the journeys and rituals of the Tingari ancestors, a group of ancestral beings important in Aboriginal tradition. This artwork captures their travels across the land, leaving sacred sites and knowledge behind, which are crucial for guiding initiations and teaching younger generations. The abstract patterns and concentric circles in the piece echo the sacred landscape, blending spiritual stories with the natural geography of the desert.</div></figcaption></figure><figure class="gallery-image"><a href="/lib/exe/fetch.php?media=wiki:art4.jpg" title="Tali by Eubena Nampitjin" data-caption="&lt;b&gt;Tali by Eubena Nampitjin&lt;/b&gt; &amp;ndash; Tali by Eubena Nampitjin depicts the sand dunes, or &amp;quot;tali,&amp;quot; of the Great Sandy Desert, a landscape deeply connected to her heritage. The artwork uses flowing lines and rich earthy tones to represent the movement and patterns of the dunes shaped by wind and time. Through this piece, Nampitjin brings to life her memories and ancestral connections to the desert, highlighting the beauty and spiritual importance of her homeland." class="lightbox JSnocheck" rel="lightbox[gal-1338c681c4f271dc0b764e11bae8]" data-url="/lib/exe/fetch.php?media=wiki:art4.jpg"><img width="600" height="600" src="/lib/exe/fetch.php?w=600&amp;h=600&amp;tok=39015f&amp;media=wiki:art4.jpg" alt="art4.jpg" loading="lazy" /></a><figcaption><a href="/lib/exe/fetch.php?media=wiki:art4.jpg" class="gallery-title" title="Tali by Eubena Nampitjin">Tali by Eubena Nampitjin</a><div class="gallery-caption">Tali by Eubena Nampitjin depicts the sand dunes, or &quot;tali,&quot; of the Great Sandy Desert, a landscape deeply connected to her heritage. The artwork uses flowing lines and rich earthy tones to represent the movement and patterns of the dunes shaped by wind and time. Through this piece, Nampitjin brings to life her memories and ancestral connections to the desert, highlighting the beauty and spiritual importance of her homeland.</div></figcaption></figure><figure class="gallery-image"><a href="/lib/exe/fetch.php?media=artwork.png" title="The beautiful Aboriginal artwork by you" data-caption="&lt;b&gt;The beautiful Aboriginal artwork by you&lt;/b&gt; &amp;ndash; A beautiful Aboriginal artwork created by you, reflecting culture, identity, and creative expression." class="lightbox JSnocheck" rel="lightbox[gal-1338c681c4f271dc0b764e11bae8]" data-url="/lib/exe/fetch.php?media=artwork.png"><img width="367" height="430" src="/lib/exe/fetch.php?w=367&amp;h=430&amp;tok=f499f8&amp;media=artwork.png" alt="artwork.png" loading="lazy" /></a><figcaption><a href="/lib/exe/fetch.php?media=artwork.png" class="gallery-title" title="The beautiful Aboriginal artwork by you">The beautiful Aboriginal artwork by you</a><div class="gallery-caption">A beautiful Aboriginal artwork created by you, reflecting culture, identity, and creative expression.</div></figcaption></figure></div></div>
